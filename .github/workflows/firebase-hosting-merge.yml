name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar config.js a partir dos secrets
        run: |
          cat > config/config.js << 'ENDOFFILE'
          const ENV = {
            GEMINI_API_KEY:      "${{ secrets.GEMINI_API_KEY }}",
            AZURE_FACE_KEY:      "${{ secrets.AZURE_FACE_KEY }}",
            AZURE_FACE_ENDPOINT: "${{ secrets.AZURE_FACE_ENDPOINT }}",
            FACECHECK_API_KEY:   "${{ secrets.FACECHECK_API_KEY }}",
          };
          Object.freeze(ENV);

          const FIREBASE_CONFIG = {
            apiKey:            "${{ secrets.FIREBASE_API_KEY }}",
            authDomain:        "facescan-ed497.firebaseapp.com",
            projectId:         "facescan-ed497",
            storageBucket:     "facescan-ed497.firebasestorage.app",
            messagingSenderId: "151691520653",
            appId:             "1:151691520653:web:547c2f9b4122dd2dd610c4",
          };
          Object.freeze(FIREBASE_CONFIG);
          ENDOFFILE

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FACESCAN_ED497 }}
          channelId: live
          projectId: facescan-ed497
